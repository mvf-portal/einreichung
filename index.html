<!--
  einreichung.m-vf.de ist seit dem 06.09.2026 nur noch die kurze Adresse.

  Die Seite selbst liegt auf dem MVF-Server, neben einreichung.php - sie muss
  dort liegen: Der Endpunkt laedt WordPress ueber wp-load.php direkt, und das
  geht nur aus demselben Verzeichnisbaum heraus. Ein eigener Server fuer die
  Subdomain haette diesen Zugriff gekostet.

  Warum diese Datei ueberhaupt bleibt: Die kurze Adresse steht in gedruckten
  Heften und in Mails. Sie einfach sterben zu lassen hiesse, dass jemand mit
  einem Heft in der Hand vor einer Fehlermeldung steht.

  Die Quelle der eigentlichen Seite liegt in diesem Repo unter _quelle/ - der
  Unterstrich haelt sie von GitHub Pages fern, damit hier nie eine zweite,
  veraltete Fassung erreichbar ist. Genau das war naemlich passiert: Am
  06.09.2026 stand hier zwei Stunden lang ein Formular ohne die Rubriken
  Kongressnachbericht und Sonderdruck, waehrend der Server sie schon kannte.
-->
